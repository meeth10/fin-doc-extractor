<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Fin Doc Extractor</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <strong>FIN DOC EXTRACTOR</strong>
      <span>Financial evidence lab</span>
    </div>
    <label class="upload-button">
      <input id="file" type="file" accept="application/pdf" />
      <span>Upload PDF</span>
    </label>
  </header>

  <main id="empty" class="empty-state">
    <div class="eyebrow">DOCUMENT INTELLIGENCE</div>
    <h1>From PDF to analyst-ready evidence.</h1>
    <p>Extract the statement pages, preserve the source evidence, and inspect Balance Sheet, Income Statement and Cash Flow separately.</p>
    <label class="empty-upload upload-button">
      <input id="file-empty" type="file" accept="application/pdf" />
      <span>Select a financial PDF</span>
    </label>
  </main>

  <main id="app" hidden>
    <aside class="sidebar">
      <section id="summary" class="summary"></section>
      <div class="sidebar-heading"><span>Pages</span><span id="page-count"></span></div>
      <div id="pages" class="pages"></div>
    </aside>

    <section class="workspace">
      <nav id="main-nav" class="main-nav">
        <button data-view="overview" class="active">Overview</button>
        <button data-view="balance_sheet">Balance Sheet</button>
        <button data-view="income_statement">Income Statement</button>
        <button data-view="cash_flow">Cash Flow</button>
        <button data-view="tables">All Tables</button>
        <button data-view="text">Raw Text</button>
      </nav>
      <div id="content" class="content"></div>
    </section>
  </main>

  <div id="loading" hidden>
    <div class="loading-card">
      <div class="spinner"></div>
      <div id="loading-title">Preparing document</div>
      <div id="loading-detail">Uploading PDF…</div>
      <div class="progress-track"><div id="progress-bar"></div></div>
    </div>
  </div>

  <script src="/static/app.js"></script>
</body>
</html>
